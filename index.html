<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Headlock Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    background: radial-gradient(circle at top, #0b1a2b, #050b14);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: white;
}

/* Animated dots background */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background-image: radial-gradient(#00bfff33 2px, transparent 2px);
    background-size: 80px 80px;
    animation: moveBg 20s linear infinite;
}

@keyframes moveBg {
    0% { transform: translate(0,0); }
    100% { transform: translate(-200px,-200px); }
}

.container {
    width: 350px;
    text-align: center;
    z-index: 2;
}

/* Avatar */
.avatar {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 4px solid #1e90ff;
    box-shadow: 0 0 20px #1e90ff;
    margin: auto;
    overflow: hidden;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Title */
.title {
    margin-top: 20px;
    font-size: 32px;
    font-weight: 700;
    color: #1e90ff;
    text-shadow: 0 0 15px #1e90ff;
}

.subtitle {
    margin: 10px 0 30px;
    color: #aaa;
}

/* Box */
.box {
    border: 2px solid #1e90ff;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 0 20px #1e90ff55;
}

/* Input */
.input-box {
    border: 2px solid #1e90ff;
    border-radius: 15px;
    padding: 12px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
}

.input-box input {
    background: none;
    border: none;
    outline: none;
    color: white;
    width: 100%;
    padding-left: 10px;
    font-size: 16px;
}

/* Button */
button {
    width: 100%;
    padding: 15px;
    border-radius: 15px;
    border: none;
    background: linear-gradient(90deg, #1e90ff, #4facfe);
    color: white;
    font-weight: 600;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 15px #1e90ff;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px #1e90ff;
}

.forgot {
    margin-top: 15px;
    color: #1e90ff;
    cursor: pointer;
}

/* Footer list */
.features {
    margin-top: 25px;
    text-align: left;
    font-size: 14px;
    color: #aaa;
}

.features div {
    margin: 8px 0;
}

.footer {
    margin-top: 20px;
    font-size: 12px;
    color: #555;
}

/* Floating dots */
.dot {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #00bfff;
    border-radius: 50%;
    animation: float 6s infinite ease-in-out;
}

@keyframes float {
    0%,100% { transform: translateY(0); opacity: 0.3; }
    50% { transform: translateY(-20px); opacity: 1; }
}
</style>
</head>

<body>

<div class="container">

    <div class="avatar">
        <img src="https://i.imgur.com/2yaf2wb.png">
    </div>

    <div class="title">HEADLOCK</div>
    <div class="subtitle">Nhập key để tiếp tục</div>

    <div class="box">
        <div class="input-box">
            <input type="text" placeholder="Nhập Key">
        </div>

        <button onclick="login()">ĐĂNG NHẬP</button>

        <div class="forgot">Quên key?</div>
    </div>

    <div class="features">
        <div>✔ Hỗ trợ chính xác tuyệt đối</div>
        <div>✔ Không khóa acc, hại máy</div>
        <div>✔ Hỗ trợ 24/7</div>
    </div>

    <div class="footer">
        © 2025 HEADLOCK <br> All rights reserved
    </div>

</div>

<!-- Floating dots -->
<div class="dot" style="top:20%;left:10%;"></div>
<div class="dot" style="top:60%;left:80%;"></div>

<script>
function login(){
    const key = document.querySelector("input").value;

    if(key === ""){
        alert("Vui lòng nhập key!");
        return;
    }

    // demo fake check
    if(key === "123456"){
        alert("Đăng nhập thành công!");
    } else {
        alert("Key không đúng!");
    }
}
</script>

</body>
</html>
