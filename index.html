<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Headlock Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root{--main:#1e90ff;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Poppins',sans-serif;}
body{background:#050b14;}

/* BACKGROUND */
.bg{position:fixed;inset:0;}
.bg::before{
    content:"";
    position:absolute;
    width:200%;height:200%;
    background-image: radial-gradient(#00bfff33 2px, transparent 2px);
    background-size:60px 60px;
    animation: moveBg 25s linear infinite;
}
@keyframes moveBg{
    from{transform:translate(0,0);}
    to{transform:translate(-150px,-150px);}
}

/* WRAPPER */
.wrapper{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:100%;
    max-width:380px;
    text-align:center;
    z-index:1;
    padding:20px;
}

/* AVATAR */
.avatar{
    width:110px;height:110px;margin:auto;
    border-radius:50%;border:3px solid var(--main);
    box-shadow:0 0 25px var(--main);
    overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;}

/* TEXT */
.title{
    margin-top:18px;font-size:28px;font-weight:700;
    color:var(--main);
    text-shadow:0 0 15px var(--main);
}
.subtitle{margin:10px 0 25px;color:#aaa;}

/* BOX */
.box{
    border:2px solid var(--main);
    border-radius:20px;
    padding:18px;
    box-shadow:0 0 20px #1e90ff55;
}

/* INPUT FLOAT */
.input-box{
    position:relative;
    border:2px solid var(--main);
    border-radius:15px;
    padding:12px;
    margin-bottom:20px;
}
.input-box input{
    width:100%;
    background:none;
    border:none;
    outline:none;
    color:white;
    font-size:14px;
}
.input-box label{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#aaa;
    font-size:14px;
    transition:0.2s;
    padding:0 4px;
    background:transparent;
}
.input-box input:focus + label,
.input-box input:not(:placeholder-shown) + label{
    top:-8px;
    font-size:12px;
    color:var(--main);
    background:#050b14;
}

/* BUTTON */
button{
    width:100%;
    padding:14px;
    border-radius:15px;
    border:none;
    background:linear-gradient(90deg,#1e90ff,#4facfe);
    color:white;
    font-weight:600;
    box-shadow:0 0 15px var(--main);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}
button:active{transform:scale(0.96);}

/* TEXT */
.forgot{margin-top:15px;color:var(--main);}
.features{margin-top:25px;text-align:left;color:#aaa;font-size:14px;}
.features div{margin:8px 0;}
.footer{margin-top:20px;font-size:12px;color:#555;}

/* LOGIN POPUP */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(5px);
    opacity:0;
    pointer-events:none;
    transition:0.3s;
    z-index:999;
}
.popup{
    position:fixed;
    left:50%;
    bottom:-250px;
    transform:translateX(-50%);
    width:calc(100% - 40px);
    max-width:380px;
    background:#0b1320;
    border-radius:20px;
    border:2px solid var(--main);
    text-align:center;
    padding:20px;
    transition:0.35s;
    z-index:1000;
}
.overlay.show{opacity:1;pointer-events:auto;}
.popup.show{bottom:15px;}
.popup .icon{
    width:50px;height:50px;margin:auto;
    border-radius:50%;
    background:linear-gradient(#2f80ff,#3fa9ff);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#000;
}

/* KEY POPUP */
.key-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(6px);
    z-index:2000;
}
.key-popup{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:380px;
    background:#0b1320;
    border-radius:25px;
    border:2px solid #1e90ff;
    padding:20px;
    z-index:2001;
    text-align:center;
}
.key-title{color:#1e90ff;font-weight:700;}
.key-sub{color:#fff;font-size:20px;font-weight:700;}
.key-desc{color:#aaa;font-size:13px;margin:10px 0;}
.step{
    background:#0f1b2d;
    border-radius:15px;
    padding:10px;
    margin:8px 0;
    text-align:left;
    color:#ddd;
    font-size:13px;
}
.step span{
    background:#1e90ff;
    color:#000;
    border-radius:50%;
    padding:4px 8px;
    margin-right:8px;
}
.link-box{display:flex;gap:8px;margin-top:15px;}
.link-box input{
    flex:1;
    background:#0f1b2d;
    border:none;
    border-radius:10px;
    color:#fff;
    padding:10px;
}
.link-box button{
    background:#1e90ff;
    border:none;
    border-radius:10px;
    padding:10px;
    color:#000;
}
.actions{display:flex;gap:10px;margin-top:15px;}
.close-btn{flex:1;background:#222;color:#aaa;border:none;padding:12px;border-radius:12px;}
.open-btn{flex:1;background:#1e90ff;color:#000;border:none;padding:12px;border-radius:12px;}
</style>
</head>

<body>

<div class="bg"></div>

<div class="wrapper">
    <div class="avatar">
        <img src="https://i.imgur.com/2yaf2wb.png">
    </div>

    <div class="title">HEADLOCK</div>
    <div class="subtitle">Nhập key để tiếp tục</div>

    <div class="box">
        <div class="input-box">
            <input id="key" type="text" placeholder=" " required>
            <label>Nhập Key</label>
        </div>

        <button onclick="login()">
            <i class="fa-solid fa-right-to-bracket"></i>
            ĐĂNG NHẬP
        </button>

        <div class="forgot">Quên key?</div>
    </div>

    <div class="features">
        <div>✔ Hỗ trợ chính xác tuyệt đối</div>
        <div>✔ Không khóa acc, hại máy</div>
        <div>✔ Hỗ trợ 24/7</div>
    </div>

    <div class="footer">© 2025 HEADLOCK</div>
</div>

<!-- LOGIN POPUP -->
<div class="overlay" onclick="closePopup()"></div>
<div class="popup" id="popup">
    <div class="icon" id="icon">!</div>
    <h2 id="p-title"></h2>
    <p id="p-msg"></p>
</div>

<!-- KEY POPUP -->
<div class="key-overlay" id="keyOverlay"></div>
<div class="key-popup" id="keyPopup">
    <div class="key-title">FREE KEY VIP</div>
    <div class="key-sub">Nhận Key Miễn Phí!</div>
    <div class="key-desc">Làm theo 3 bước để lấy key</div>

    <div class="step"><span>1</span>Sao chép link</div>
    <div class="step"><span>2</span>Vượt link</div>
    <div class="step"><span>3</span>Nhận key</div>

    <div class="link-box">
        <input id="keyLink" value="https://link4m.com/qfsKUN">
        <button onclick="copyLink()">COPY</button>
    </div>

    <div class="actions">
        <button class="close-btn" onclick="closeKeyPopup()">Đóng</button>
        <button class="open-btn" onclick="openLink()">Mở link</button>
    </div>
</div>

<script>
window.onload=()=>{
    document.getElementById("keyPopup").style.display="block";
    document.getElementById("keyOverlay").style.display="block";
}

function closeKeyPopup(){
    keyPopup.style.display="none";
    keyOverlay.style.display="none";
}

function copyLink(){
    let input=document.getElementById("keyLink");
    input.select();
    document.execCommand("copy");
    alert("Đã copy!");
}

function openLink(){
    window.open(document.getElementById("keyLink").value,"_blank");
}

function showPopup(t,m,ok=true){
    document.querySelector(".overlay").classList.add("show");
    document.getElementById("popup").classList.add("show");
    document.getElementById("p-title").innerText=t;
    document.getElementById("p-msg").innerText=m;
    document.getElementById("icon").innerHTML= ok?"✔":"!";
}

function closePopup(){
    document.querySelector(".overlay").classList.remove("show");
    document.getElementById("popup").classList.remove("show");
}

function login(){
    let key=document.getElementById("key").value.trim();
    if(!key){showPopup("Thiếu key","Bạn chưa nhập key.",false);return;}
    if(key==="123456"){showPopup("OK","Đăng nhập thành công",true);}
    else{showPopup("Sai key","Không đúng!",false);}
}
</script>

</body>
</html>
