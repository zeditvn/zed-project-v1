<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Headlock Pro Fix</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root{--main:#1e90ff;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
    width:100%;height:100%;overflow:hidden;
    font-family:'Poppins',sans-serif;
    touch-action:none;
}
body{background:#050b14;}

/* BACKGROUND */
.bg{
    position:fixed;
    inset:0;
    z-index:0;
}
.bg::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background-image: radial-gradient(#00bfff33 2px, transparent 2px);
    background-size:60px 60px;
    animation: moveBg 25s linear infinite;
}
@keyframes moveBg{
    from{transform: translate(0,0);}
    to{transform: translate(-150px,-150px);}
}

/* WRAPPER */
.wrapper{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:100%;
    max-width:380px;
    text-align:center;
    z-index:1;
    padding:20px;
}

/* AVATAR */
.avatar{
    width:110px;height:110px;margin:auto;
    border-radius:50%;border:3px solid var(--main);
    box-shadow:0 0 25px var(--main);
    overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;}

/* TEXT */
.title{
    margin-top:18px;
    font-size:32px;
    font-weight:800;
    letter-spacing:1px;
    color:var(--main);
    text-shadow:0 0 20px var(--main);
}
.subtitle{
    margin:10px 0 25px;
    color:#aaa;
    font-weight:500;
}

/* BOX */
.box{
    border:2px solid var(--main);
    border-radius:20px;
    padding:18px;
    box-shadow:0 0 20px #1e90ff55;
}

/* INPUT FLOAT */
.input-box{
    position:relative;
    border:2px solid var(--main);
    border-radius:15px;
    padding:16px 12px 10px;
    margin-bottom:20px;
}
.input-box input{
    width:100%;
    background:none;
    border:none;
    outline:none;
    color:white;
    font-size:15px;
}
.input-box label{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:#aaa;
    font-size:14px;
    transition:0.25s;
    background:#050b14;
    padding:0 6px;
}
.input-box input:focus + label,
.input-box input:not(:placeholder-shown) + label{
    top:-8px;
    font-size:12px;
    color:var(--main);
}

/* ===== BUTTON XỊN ===== */
button{
    width:100%;
    padding:16px;
    border-radius:18px;
    border:none;
    background:linear-gradient(90deg,#1e90ff,#4facfe);
    color:white;
    font-weight:700;
    font-size:16px;
    letter-spacing:1px;
    box-shadow:0 0 20px #1e90ff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

/* ICON BUTTON */
button i{
    font-size:18px;
}

/* CLICK */
button:active{
    transform:scale(0.96);
}

/* TEXT */
.forgot{
    margin-top:15px;
    color:var(--main);
    font-weight:500;
}
.features{
    margin-top:25px;
    text-align:left;
    color:#aaa;
    font-size:14px;
}
.features div{margin:8px 0;}
.footer{
    margin-top:20px;
    font-size:12px;
    color:#555;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="wrapper">
    <div class="avatar">
        <img src="https://i.imgur.com/2yaf2wb.png">
    </div>

    <div class="title">HEADLOCK</div>
    <div class="subtitle">Nhập key để tiếp tục</div>

    <div class="box">

        <div class="input-box">
            <input type="text" required placeholder=" ">
            <label>Nhập Key</label>
        </div>

        <!-- BUTTON CÓ ICON -->
        <button onclick="login()">
            <i class="fa-solid fa-right-to-bracket"></i>
            ĐĂNG NHẬP
        </button>

        <div class="forgot">Quên key?</div>
    </div>

    <div class="features">
        <div>✔ Hỗ trợ chính xác tuyệt đối</div>
        <div>✔ Không khóa acc, hại máy</div>
        <div>✔ Hỗ trợ 24/7</div>
    </div>

    <div class="footer">
        © 2025 HEADLOCK <br> All rights reserved
    </div>
</div>

<script>
function login(){
    let key=document.querySelector("input").value.trim();
    if(!key){alert("Nhập key!");return;}
    if(key==="123456"){alert("OK 😎");}else{alert("Sai key!");}
}

/* CHẶN SCROLL */
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('wheel',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('gestureend',e=>e.preventDefault());
</script>

</body>
</html>
