<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Headlock Fixed</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --main: #1e90ff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

/* BODY */
body {
    height: 100%;
    background: radial-gradient(circle at top, #0b1a2b, #050b14);
    overflow-y: auto;
    overflow-x: hidden;
}

/* FIX CENTER ABSOLUTE */
.wrapper {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding:
        calc(env(safe-area-inset-top) + 20px)
        calc(env(safe-area-inset-right) + 20px)
        calc(env(safe-area-inset-bottom) + 20px)
        calc(env(safe-area-inset-left) + 20px);
}

/* BACKGROUND đứng yên */
.bg {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(#00bfff22 2px, transparent 2px);
    background-size: 70px 70px;
    z-index: 0;
}

/* CONTAINER */
.container {
    width: 100%;
    max-width: 380px;
    text-align: center;
    position: relative;
    z-index: 1;
}

/* AVATAR */
.avatar {
    width: clamp(90px, 25vw, 130px);
    height: clamp(90px, 25vw, 130px);
    margin: auto;
    border-radius: 50%;
    border: 3px solid var(--main);
    box-shadow: 0 0 25px var(--main);
    overflow: hidden;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TEXT */
.title {
    margin-top: 20px;
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 700;
    color: var(--main);
    text-shadow: 0 0 15px var(--main);
}

.subtitle {
    margin: 10px 0 25px;
    color: #aaa;
}

/* BOX */
.box {
    border: 2px solid var(--main);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 20px #1e90ff55;
}

/* INPUT */
.input-box {
    border: 2px solid var(--main);
    border-radius: 15px;
    padding: 12px;
    margin-bottom: 20px;
}

.input-box input {
    width: 100%;
    background: none;
    border: none;
    outline: none;
    color: white;
}

/* BUTTON */
button {
    width: 100%;
    padding: 14px;
    border-radius: 15px;
    border: none;
    background: linear-gradient(90deg, #1e90ff, #4facfe);
    color: white;
    font-weight: 600;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

/* TEXT */
.forgot {
    margin-top: 15px;
    color: var(--main);
}

.features {
    margin-top: 25px;
    text-align: left;
    color: #aaa;
}

.features div {
    margin: 8px 0;
}

.footer {
    margin-top: 20px;
    font-size: 12px;
    color: #555;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="wrapper">

<div class="container">

    <div class="avatar">
        <img src="https://i.imgur.com/2yaf2wb.png">
    </div>

    <div class="title">HEADLOCK</div>
    <div class="subtitle">Nhập key để tiếp tục</div>

    <div class="box">
        <div class="input-box">
            <input type="text" placeholder="Nhập Key">
        </div>

        <button onclick="login()">ĐĂNG NHẬP</button>
        <div class="forgot">Quên key?</div>
    </div>

    <div class="features">
        <div>✔ Hỗ trợ chính xác tuyệt đối</div>
        <div>✔ Không khóa acc, hại máy</div>
        <div>✔ Hỗ trợ 24/7</div>
    </div>

    <div class="footer">
        © 2025 HEADLOCK <br> All rights reserved
    </div>

</div>

</div>

<script>
function login(){
    const key = document.querySelector("input").value.trim();

    if(!key){
        alert("Nhập key!");
        return;
    }

    if(key === "123456"){
        alert("OK VIP 😎");
    } else {
        alert("Sai key!");
    }
}
</script>

</body>
</html>
