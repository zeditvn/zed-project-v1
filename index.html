<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Headlock Pro Fix</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root{--main:#1e90ff;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
    width:100%;height:100%;overflow:hidden;
    font-family:'Poppins',sans-serif;
    touch-action:none;
}
body{background:#050b14;}

/* BACKGROUND */
.bg{
    position:fixed;
    inset:0;
    z-index:0;
}
.bg::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background-image: radial-gradient(#00bfff33 2px, transparent 2px);
    background-size:60px 60px;
    animation: moveBg 25s linear infinite;
}
@keyframes moveBg{
    from{transform: translate(0,0);}
    to{transform: translate(-150px,-150px);}
}

/* WRAPPER */
.wrapper{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:100%;
    max-width:380px;
    text-align:center;
    z-index:1;
    padding:20px;
}

/* AVATAR */
.avatar{
    width:110px;height:110px;margin:auto;
    border-radius:50%;border:3px solid var(--main);
    box-shadow:0 0 25px var(--main);
    overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;}

/* TITLE */
.title{
    margin-top:18px;
    font-size:34px;
    font-weight:900;
    letter-spacing:2px;
    color:#2f80ff;
    text-shadow:0 0 25px #1e90ff;
}
.subtitle{
    margin:10px 0 25px;
    color:#aaa;
}

/* BOX */
.box{
    border:2px solid var(--main);
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 25px #1e90ff55;
}

/* INPUT */
.input-box{
    border:2px solid var(--main);
    border-radius:15px;
    padding:14px;
    margin-bottom:20px;
}
.input-box input{
    width:100%;
    background:none;
    border:none;
    outline:none;
    color:white;
}

/* BUTTON */
button{
    width:100%;
    padding:15px;
    border-radius:18px;
    border:none;
    background:linear-gradient(90deg,#2f80ff,#3fa9ff);
    color:white;
    font-weight:700;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}
button:active{transform:scale(0.96);}

/* TEXT */
.forgot{margin-top:15px;color:#1e90ff;}
.features{margin-top:25px;text-align:left;color:#aaa;font-size:14px;}
.features div{margin:8px 0;}
.footer{margin-top:20px;font-size:12px;color:#555;}

/* ===== POPUP ===== */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(6px);
    opacity:0;
    pointer-events:none;
    transition:0.3s;
    z-index:999;
}

.popup{
    position:fixed;
    left:50%;
    bottom:-300px;
    transform:translateX(-50%);
    width:90%;
    max-width:380px;
    background:#0b1320;
    border-radius:25px;
    border:2px solid var(--main);
    text-align:center;
    padding:25px;
    transition:0.4s;
    z-index:1000;
}

.overlay.show{
    opacity:1;
    pointer-events:auto;
}
.popup.show{
    bottom:20px;
}

/* ICON */
.popup .icon{
    width:60px;
    height:60px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(#2f80ff,#3fa9ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    color:#000;
}

/* TEXT */
.popup h2{
    margin-top:15px;
    color:#fff;
    font-weight:700;
}
.popup p{
    color:#aaa;
    margin-top:5px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="wrapper">
    <div class="avatar">
        <img src="https://i.imgur.com/2yaf2wb.png">
    </div>

    <div class="title">HEADLOCK</div>
    <div class="subtitle">Nhập key để tiếp tục</div>

    <div class="box">
        <div class="input-box">
            <input type="text" placeholder="Nhập Key">
        </div>

        <button onclick="login()">
            <i class="fa-solid fa-right-to-bracket"></i>
            ĐĂNG NHẬP
        </button>

        <div class="forgot">Quên key?</div>
    </div>

    <div class="features">
        <div>✔ Hỗ trợ chính xác tuyệt đối</div>
        <div>✔ Không khóa acc, hại máy</div>
        <div>✔ Hỗ trợ 24/7</div>
    </div>

    <div class="footer">
        © 2025 HEADLOCK <br> All rights reserved
    </div>
</div>

<!-- POPUP -->
<div class="overlay" onclick="closePopup()"></div>

<div class="popup" id="popup">
    <div class="icon" id="icon">!</div>
    <h2 id="p-title">Thông báo</h2>
    <p id="p-msg">...</p>
</div>

<script>
function showPopup(title,msg,ok=true){
    document.querySelector(".overlay").classList.add("show");
    document.getElementById("popup").classList.add("show");

    document.getElementById("p-title").innerText=title;
    document.getElementById("p-msg").innerText=msg;

    let icon=document.getElementById("icon");
    icon.innerHTML = ok ? "✔" : "!";
}

function closePopup(){
    document.querySelector(".overlay").classList.remove("show");
    document.getElementById("popup").classList.remove("show");
}

function login(){
    let key=document.querySelector("input").value.trim();

    if(!key){
        showPopup("Thiếu key","Bạn chưa nhập key.",false);
        return;
    }

    if(key==="123456"){
        showPopup("Thành công","Đăng nhập OK 😎",true);
    }else{
        showPopup("Sai key","Key không đúng!",false);
    }
}

/* CHẶN SCROLL */
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('wheel',e=>e.preventDefault(),{passive:false});
</script>

</body>
</html>
